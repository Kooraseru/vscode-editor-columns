[download.values]
en-US = "Download"
ja-JP = "ダウンロード"
[download_text.values]
en-US = "Download VS Code Editor Columns from its"
ja-JP = "VS Code Editor Columns は次のリンクからダウンロードできます："
[download_wsl_note.values]
en-US = "On Windows, run this command from PowerShell or Command Prompt. Running `code` inside WSL targets the remote Linux VS Code Server instead of the local Windows desktop installation required by the workbench bridge."
ja-JP = "Windows では、このコマンドを PowerShell またはコマンド プロンプトから実行してください。WSL 内で `code` を実行すると、ワークベンチブリッジに必要なローカルの Windows デスクトップ版ではなく、リモートの Linux VS Code Server が対象になります。"
[overview.values]
en-US = "Overview"
ja-JP = "概要"
[overview_text.values]
en-US = "Columns contain real interactive controls and remain synchronized with scrolling, folding, document edits, line-height changes, and editor resizing. Native context menus, selections, minimap behavior, breakpoints, commands, and editor contributions remain owned by VS Code."
ja-JP = "列には実際の対話型コントロールが含まれ、スクロール、折りたたみ、文書編集、行の高さの変更、エディターのサイズ変更に同期します。コンテキストメニュー、選択、ミニマップ、ブレークポイント、コマンドなどは引き続き VS Code が管理します。"
[api.values]
en-US = "Provider API"
ja-JP = "プロバイダー API"
[api_intro.values]
en-US = "Consumer extensions declare the dependency, activate it, and register one or more column providers."
ja-JP = "利用する拡張機能は依存関係を宣言して有効化し、1 つ以上の列プロバイダーを登録します。"
[api_note.values]
en-US = "Cell edits never modify document text automatically. The provider decides whether and where values are persisted."
ja-JP = "セルの編集によって文書テキストが自動的に変更されることはありません。値を保存するかどうか、また保存先はプロバイダーが決定します。"
[lifecycle.values]
en-US = "Extension lifecycle"
ja-JP = "拡張機能のライフサイクル"
[lifecycle_text.values]
en-US = "The local workbench bridge is dormant without a live Editor Columns extension host. Disabling or stopping the extension removes all column DOM and restores native editor geometry. Uninstalling the extension restores the original workbench file after VS Code restarts."
ja-JP = "ローカルワークベンチブリッジは Editor Columns の拡張機能ホストが動作していない場合は休止します。拡張機能を無効化または停止すると列の DOM が削除され、ネイティブエディターの配置が復元されます。アンインストール後に VS Code を再起動すると元のワークベンチファイルが復元されます。"
[compatibility.values]
en-US = "Compatibility"
ja-JP = "互換性"
[compatibility_text.values]
en-US = "The bridge checks for the editor structure it needs when installed. For protected VS Code installations, Authorize Setup uses the Linux system privilege prompt; Copy Setup Command is available for other systems or as a fallback. VS Code may show an installation-integrity warning while the bridge is installed."
ja-JP = "ブリッジはインストール時に必要なエディター構造を確認します。保護された VS Code インストールでは、Linux の「Authorize Setup」でシステムの権限確認を利用できます。他の環境や失敗時には「Copy Setup Command」を利用できます。ブリッジのインストール中は VS Code がインストール整合性の警告を表示する場合があります。"
[license_heading.values]
en-US = "License"
ja-JP = "ライセンス"
