name: Publish generated main

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-generated-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish generated repository
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'source'
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Download validated repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-repository
          path: ${{ runner.temp }}/vscode-editor-columns-main
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Replace main with generated repository
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if git fetch origin main; then
            git checkout --force -B main origin/main
          else
            git checkout --orphan main
            git rm --cached -r .
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/vscode-editor-columns-main/." .
          git add --all
          if git diff --cached --quiet; then
            echo "Generated main is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish source @ ${SOURCE_SHA}"
          git push origin HEAD:main
