name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [source]
  push:
    branches: [source]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repository-contracts:
    name: Repository Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Lua
        run: sudo apt-get update && sudo apt-get install --yes lua5.4
      - name: Validate source branch
        uses: ./.github/actions/branches
        with:
          branch: ${{ github.event.pull_request.base.ref || github.ref_name }}
      - name: Validate repository shape
        shell: bash
        run: |
          required=(.github assets i18n releases repo src README.md LICENSE)
          for path in "${required[@]}"; do test -e "$path" || { echo "Missing $path" >&2; exit 1; }; done
          test ! -e code || { echo "Legacy code/ directory must not exist" >&2; exit 1; }
      - name: Validate Git whitespace
        run: git diff --check

  extension:
    name: Extension
    needs: repository-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate extension source
        run: npm --prefix src run check

  github-actions:
    name: GitHub Actions
    needs: repository-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Lua
        run: sudo apt-get update && sudo apt-get install --yes lua5.4
      - name: Parse automation Lua
        run: find .github -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
      - name: Validate actions and workflows
        run: lua5.4 .github/scripts/actionlint.lua

  tests:
    name: Tests
    needs: extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run extension tests
        run: npm --prefix src test

  localization:
    name: Localization
    needs: repository-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Lua
        run: sudo apt-get update && sudo apt-get install --yes lua5.4
      - name: Validate localization
        run: lua5.4 i18n/validate.lua

  release-system:
    name: Release System
    needs: repository-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Lua
        run: sudo apt-get update && sudo apt-get install --yes lua5.4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate release records
        run: lua5.4 releases/test.lua
      - name: Resolve publication metadata
        run: node src/scripts/resolve-release.mjs

  build-repository:
    name: Build Repository
    needs: [tests, localization, release-system, github-actions]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build generated repository
        uses: ./.github/actions/build-repo
        with:
          destination: ${{ runner.temp }}/vscode-editor-columns-main
      - name: Upload generated repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-repository
          path: ${{ runner.temp }}/vscode-editor-columns-main
          if-no-files-found: error

  package-extension:
    name: Package Extension
    needs: build-repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download generated repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-repository
          path: .generated/main
      - name: Package validated repository
        run: npm --prefix src run package:built
      - name: Upload VSIX files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix-packages
          path: .generated/release/*.vsix
          if-no-files-found: error

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    needs: repository-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  ci-gate:
    name: CI Gate
    if: always()
    needs: [repository-contracts, extension, tests, github-actions, localization, release-system, build-repository, package-extension, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI jobs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          failures="$(
            jq -r --arg event "$EVENT_NAME" '
              to_entries[]
              | select(.value.result != "success" and ((.key == "dependency-review" and $event != "pull_request" and .value.result == "skipped") | not))
              | "\(.key): \(.value.result)"
            ' <<<"$JOB_RESULTS"
          )"
          if [ -n "$failures" ]; then
            echo "Required CI jobs did not succeed:"
            echo "$failures"
            exit 1
          fi
          echo "All required CI jobs succeeded"

  publication:
    name: Publication
    needs: [ci-gate, package-extension]
    if: github.event_name == 'push' && github.ref == 'refs/heads/source'
    permissions:
      actions: read
      contents: write
      id-token: write
      pull-requests: read
    uses: ./.github/workflows/publish.yml
    with:
      source-sha: ${{ github.sha }}
