name: Publish

on:
  workflow_call:
    inputs:
      source-sha:
        description: Validated source commit to publish.
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-source
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve Release
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.release.outputs.enabled }}
      record: ${{ steps.release.outputs.record }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      source-date: ${{ steps.source.outputs.date }}
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Resolve release metadata
        id: release
        run: node src/scripts/resolve-release.mjs
      - name: Resolve source date
        id: source
        run: echo "date=$(git show -s --format=%cs HEAD)" >> "$GITHUB_OUTPUT"

  publish-main:
    name: Publish Generated State
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
      - name: Download validated repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-repository
          path: ${{ runner.temp }}/vscode-editor-columns-main
      - name: Replace main with generated repository
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          if git fetch origin main; then
            git checkout --force -B main origin/main
          else
            git checkout --orphan main
            git rm --cached -r .
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/vscode-editor-columns-main/." .
          git add --all
          if git diff --cached --quiet; then
            echo "Generated main is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish source @ ${SOURCE_SHA}"
          git push origin HEAD:main

  validate-tag:
    name: Validate Tag
    needs: resolve-release
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Validate publication tag
        id: tag
        env:
          ENABLED: ${{ needs.resolve-release.outputs.enabled }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          if [ "$ENABLED" != "true" ]; then
            echo "Publication is not enabled."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          existing="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [ "$existing" != "$SOURCE_SHA" ]; then
            echo "Tag $RELEASE_TAG already targets $existing, not $SOURCE_SHA" >&2
            exit 1
          fi
          echo "Release $RELEASE_TAG is already published from this source commit."
          echo "publish=false" >> "$GITHUB_OUTPUT"

  build-release-notes:
    name: Build Release Notes
    needs: [resolve-release, validate-tag]
    if: needs.validate-tag.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Build release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD: ${{ needs.resolve-release.outputs.record }}
          VERSION: ${{ needs.resolve-release.outputs.version }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          SOURCE_DATE: ${{ needs.resolve-release.outputs.source-date }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          cp "releases/records/$RECORD.md" "$RUNNER_TEMP/release-notes.md"
          {
            echo
            echo "## Publication Metadata"
            echo
            echo "- Extension version: \`$VERSION\`"
            echo "- Release tag: \`$RELEASE_TAG\`"
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo "- Source date: $SOURCE_DATE"
            echo
            echo "## Included Pull Requests"
            gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/pulls" --jq '.[] | "- #\(.number) — \(.title) (@\(.user.login))"'
          } >> "$RUNNER_TEMP/release-notes.md"
      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub Release
    needs: [resolve-release, validate-tag, build-release-notes]
    if: needs.validate-tag.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          VERSION: ${{ needs.resolve-release.outputs.version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: >-
          gh release create "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"
          --target "$SOURCE_SHA"
          --title "VS Code Editor Columns $VERSION"
          --notes-file "$RUNNER_TEMP/release-notes.md"

  attach-vsix:
    name: Attach VSIX
    needs: [resolve-release, validate-tag, publish-github-release]
    if: needs.validate-tag.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download validated VSIX files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix-packages
          path: ${{ runner.temp }}/vsix
      - name: Attach VSIX files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/vsix/*.vsix --repo "$GITHUB_REPOSITORY" --clobber

  marketplace:
    name: Marketplace Deployment
    needs: [resolve-release, validate-tag]
    if: needs.validate-tag.outputs.publish == 'true'
    environment:
      name: marketplace
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validated VSIX files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix-packages
          path: ${{ runner.temp }}/vsix
      - name: Resolve validated VSIX
        id: package
        env:
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          package="$RUNNER_TEMP/vsix/vscode-editor-columns-$VERSION.vsix"
          test -f "$package" || { echo "Validated VSIX not found: $package" >&2; exit 1; }
          echo "path=$package" >> "$GITHUB_OUTPUT"
      - name: Authenticate with Microsoft Entra
        uses: Azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Install VSCE
        run: npm install --global @vscode/vsce@3.9.2
      - name: Publish validated VSIX
        run: vsce publish --packagePath "${{ steps.package.outputs.path }}" --azure-credential
